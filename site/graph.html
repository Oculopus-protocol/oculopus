<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph — Oculopus</title>
<meta name="description" content="The counterparty graph — pick an agent and see who it has transacted with, sized by volume and standing.">
<meta name="theme-color" content="#0A0D13">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="stylesheet" href="/assets/oculopus.css">
<script src="/assets/site.js"></script>
<script src="/assets/demo.js"></script>
<style>
  .gwrap{height:calc(100vh - 64px);overflow:hidden;padding-top:12px}
  .gpage{height:100%;display:flex;flex-direction:column;padding:0 20px}
  .gtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .gtop input{flex:0 1 440px;min-width:200px;font:13px "Overpass Mono",monospace;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 15px;height:40px;outline:none}
  .gtop input:focus{border-color:var(--accent)}
  .ggrid{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:14px}
  @media(max-width:1000px){.ggrid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}}
  .gside{position:relative;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .gs-x{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--dim);cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center}
  .gs-x:hover{color:var(--text);background:var(--surface-2)}
  #focusPanel.has-focus .gs-x{display:flex}
  #focusPanel.has-focus .body{padding-top:42px}
  .gav{width:34px;height:34px;flex:none;border-radius:6px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(155deg,var(--surface),var(--bg-2));border:1px solid var(--line);color:var(--dim)}
  .gav svg{width:19px;height:19px}.gav img{width:100%;height:100%;object-fit:cover}
  .gs-id{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .gside .body{padding:16px 18px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:none}
  .gside .body::-webkit-scrollbar{display:none}
  .gs-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .gs-head h3{font-size:15px}
  .gs-head .sc{font:600 20px "Overpass Mono",monospace;letter-spacing:-.5px}
  .gs-sub{font:11px "Overpass Mono",monospace;color:var(--faint);margin:2px 0 12px}
  .kv{display:flex;justify-content:space-between;gap:10px;font:12px "Overpass Mono",monospace;padding:7px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}.kv span:first-child{color:var(--dim)}
  .sect{font:9px "Overpass Mono",monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
  .hint2{color:var(--faint);font-size:11.5px;line-height:1.6}
  .empty2{color:var(--faint);font-size:12px;line-height:1.6}
  .stage{position:relative;border:1px solid var(--line);border-radius:12px;background:radial-gradient(120% 120% at 50% 40%,#0f1116,#08090c);min-height:0;overflow:hidden}
  .stage svg{display:block;width:100%;height:100%}
  .gnode{cursor:pointer}
  .glabel{font:9.5px "Overpass Mono",monospace;fill:var(--dim);pointer-events:none}
  .glabel.f{fill:var(--accent-2);font-size:11px}
  .ghelp{position:absolute;right:12px;top:12px;font:10px "Overpass Mono",monospace;color:var(--faint)}
  .gtip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--line-2);padding:8px 11px;font:10.5px "Overpass Mono",monospace;color:var(--text);line-height:1.6;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap;transform:translateY(-100%)}
  .gmid{display:flex;flex-direction:column;min-height:0;gap:10px}
  .gmid .stage{flex:1;min-height:0}
  .gmode{position:absolute;left:12px;top:12px;display:flex;gap:2px;z-index:5}
  .gmode button{font:9.5px "Overpass Mono",monospace;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:var(--surface);border:1px solid var(--line-2);padding:5px 11px;cursor:pointer}
  .gmode button.on{color:var(--brand-ink);background:var(--accent);border-color:var(--accent)}
  .glegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);padding:7px 14px;font:10px "Overpass Mono",monospace;color:var(--dim)}
  .glegend .lg{display:inline-flex;align-items:center;gap:6px}
  .glegend .lg.d{color:var(--faint)}
  .glegend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .cplist{margin-top:6px}
  .cprow{display:grid;grid-template-columns:1fr 44px auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;font:11px "Overpass Mono",monospace}
  .cprow:hover,.cprow.sel{background:var(--surface-2)}
  .cpr-ad{color:var(--text);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpr-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .cpr-bar{height:4px;background:var(--line);position:relative}
  .cpr-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .cpr-m{color:var(--dim);font-size:10px;white-space:nowrap;text-align:right}
  /* counterparty list — overlay inside the stage, collapsible by clicking its header */
  .cpbox{position:absolute;right:12px;top:38px;width:262px;max-height:calc(100% - 52px);display:flex;flex-direction:column;background:rgba(11,15,22,.9);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;z-index:4}
  .cpbox .cph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
  .cpbox .cph h4{font:600 12px "Space Grotesk",sans-serif;display:flex;align-items:center;gap:7px}
  .cpbox .cph .n{font:9.5px "Overpass Mono",monospace;color:var(--dim);border:1px solid var(--line-2);padding:0 5px}
  .cpbox .cph .cv{font:10px "Overpass Mono",monospace;color:var(--faint);transition:transform .2s}
  .cpbox.collapsed .cpbody{display:none}
  .cpbox.collapsed .cph{border-bottom:none}
  .cpbox.collapsed .cph .cv{transform:rotate(-90deg)}
  .cpbody{overflow-y:auto;padding:2px 12px 8px;scrollbar-width:none}
  .cpbody::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<canvas id="dots"></canvas>

<header><div class="wrap"><nav class="nav">
  <a class="brand" href="/"><img src="/assets/logo-mark.png" alt="">Oculopus <span style="color:var(--faint);font-weight:500;font-size:11px;letter-spacing:2px;font-family:'Overpass Mono',monospace">APP</span></a>
  <div class="links">
    <a href="/explore">Explore</a><a class="on" href="/graph">Graph</a><a href="/api">API</a><a href="/network">Network</a>
  </div>
  <div class="right">
    <a class="btn ghost" href="/">← Site</a>
  </div>
</nav></div></header>

<div class="section gwrap"><div class="gpage">
  <div class="gtop">
    <div class="frame sm" style="margin:0"><h2>Counterparty graph</h2></div>
    <input id="q" placeholder="focus — name, 0x or id" autocomplete="off" spellcheck="false">
  </div>
  <div class="ggrid">
    <aside class="gside" id="focusPanel"><button class="gs-x" id="clearFocus" title="Close view" aria-label="Close">✕</button><div class="body" id="side"></div></aside>
    <div class="gmid">
      <div class="stage" id="stage">
        <svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="ghelp">drag · hover for stats · click to locate</div>
        <div class="cpbox" id="cpbox">
          <div class="cph" id="cph"><h4>Counterparties <span class="n" id="cpn">0</span></h4><span class="cv">▾</span></div>
          <div class="cpbody" id="cpbody"></div>
        </div>
        <div class="gtip" id="gtip"></div>
      </div>
      <div class="glegend">
        <span class="lg"><span class="dot" style="background:var(--accent-2)"></span>focus agent</span>
        <span class="lg"><span class="dot" style="background:rgba(63,178,127,.4);border:1px solid var(--good)"></span>counterparty · healthy</span>
        <span class="lg"><span class="dot" style="background:rgba(229,72,77,.4);border:1px solid var(--bad)"></span>counterparty · has failures</span>
        <span class="lg d">node = volume · nearer centre = higher standing</span>
      </div>
    </div>
    <aside class="gside"><div class="body" id="side2"><div class="empty2">Click a counterparty to see its details &amp; stats.</div></div></aside>
  </div>
</div></div>

<script>
const API = window.OC_API || "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = a => a && a.length > 16 ? a.slice(0, 8) + "…" + a.slice(-4) : (a || "");
const grade = s => s >= 45 ? "var(--brand)" : s < 30 ? "var(--bad)" : "var(--text)";

// The agent pool — providers + buyers. Loaded from the node when one is connected,
// else from the shared demo dataset (the same agents the Explore leaderboard shows).
// The counterparty graph is built over THIS pool, so every node is a real agent you
// can search, click and walk to — the graph and the leaderboard stay in lockstep.
let POOL = [];
const nameOf = a => (a.metadataURI && /^https?:\/\/(?!127\.|localhost|0\.0\.0\.0|10\.|192\.168\.|172\.\d)/i.test(a.metadataURI)) ? a.metadataURI.replace(/^https?:\/\//, "").replace(/\/$/, "") : short(a.address);
async function loadPool() {
  if (API) {
    const [d, bu] = await Promise.all([
      fetch(API + "/directory").then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(API + "/buyers").then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    if (d && d.agents) {
      const provs = d.agents.map(a => ({ address: a.address, id: a.agentId != null ? String(a.agentId) : "—", name: nameOf(a), cat: a.categoryLabel || "Agent", score: +a.score || 25, uniq: a.uniqueCounterparties || 6, role: "provider" }));
      const buys = (bu && bu.buyers ? bu.buyers : []).map(x => ({ address: x.address, id: "—", name: short(x.address), cat: "Buyer", score: +x.score || 25, uniq: x.uniqueCounterparties || 4, role: "buyer" }));
      POOL = provs.concat(buys);
      if (POOL.length) return;
    }
  }
  POOL = OC_DEMO.providers.map(o => ({ address: o.address, id: String(o.agentId), name: o.name, cat: o.categoryLabel, score: o.score, uniq: o.uniq, role: "provider" }))
    .concat(OC_DEMO.buyers.map(o => ({ address: o.address, id: "—", name: o.name, cat: "Buyer", score: o.score, uniq: o.uniq, role: "buyer" })));
}
const byKey = k => { k = String(k).toLowerCase().trim(); if (!k) return null; return POOL.find(a => a.address === k || a.id === k || a.name === k) || POOL.find(a => a.address.includes(k) || (a.name && a.name.toLowerCase().includes(k))); };

// default agent avatar — neutral gray/white robot mark (matches Explore)
const AGENT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="2.5"/><path d="M12 4.6v3.4"/><circle cx="12" cy="3.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.5" cy="13" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13" r="1.15" fill="currentColor" stroke="none"/></svg>`;
const avatarHtml = () => `<span class="gav">${AGENT_SVG}</span>`;

function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let t = Math.imul(h ^ h >>> 15, 1 | h); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// counterparties = real agents from the pool, chosen deterministically for this focus.
// Per-edge stats are synthesised (the demo has no real edge list) but the nodes are the
// same agents as the leaderboard, so clicking through the graph walks real identities.
function buildNetwork(a) {
  const rnd = seeded(a.address + "|net");
  const others = POOL.filter(x => x.address !== a.address);
  const shuffled = others.map(x => ({ x, k: rnd() })).sort((p, q) => p.k - q.k).map(o => o.x);
  const n = Math.max(3, Math.min(a.uniq || 6, shuffled.length));
  const cps = [];
  for (let i = 0; i < n; i++) {
    const other = shuffled[i], r2 = seeded(a.address + other.address);
    const receipts = 1 + Math.floor(r2() * 6);
    const fails = r2() < 0.28 ? Math.max(1, Math.floor(receipts * r2() * 0.5)) : 0;
    const standing = Math.max(0.12, Math.min(0.98, (other.score || 30) / 60));
    cps.push({ id: other.address, address: other.address, name: other.name, score: other.score, cat: other.cat, agent: other,
      standing, receipts, fails, success: receipts - fails, vol: +(receipts * (0.02 + r2() * 0.85)).toFixed(3) });
  }
  return cps;
}

const svg = document.getElementById("svg"), stage = document.getElementById("stage"), tip = document.getElementById("gtip");
let W = 900, H = 600, nodes = [], links = [], drag = null, raf = null, alpha = 1, focus = null, selected = null, mode = "bubble";
const NS = "http://www.w3.org/2000/svg";
const el = (t, at) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); return e; };

function setFocus(a) {
  if (!a) return;
  focus = a; selected = null; document.getElementById("q").value = "";
  document.getElementById("focusPanel").classList.add("has-focus");
  W = stage.clientWidth || 900; H = stage.clientHeight || 600;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cx = W / 2, cy = H / 2;
  const f = { key: "focus", name: a.name, r: 26, x: cx, y: cy, vx: 0, vy: 0, fixed: true, focus: true, data: a };
  nodes = [f]; links = [];
  for (const c of buildNetwork(a)) {
    const nd = { key: c.id, name: c.name, r: Math.max(8, Math.min(24, 8 + Math.sqrt(c.vol) * 10)), x: cx, y: cy, vx: 0, vy: 0, data: c };
    nodes.push(nd);
    links.push({ s: f, t: nd, rest: 90 + (1 - c.standing) * 160, bad: c.fails > 0 });
  }
  layout(); drawStatic(); if (raf) cancelAnimationFrame(raf); tick(); renderFocus(); renderCounterparties();
  document.getElementById("side2").innerHTML = '<div class="empty2">Click a counterparty to see its details &amp; stats.</div>';
}

function layout() {
  const cx = W / 2, cy = H / 2; nodes[0].x = cx; nodes[0].y = cy;
  const rnd = seeded(focus.address + "p");
  nodes.slice(1).forEach(n => { const ang = rnd() * 6.283, rad = 130 + rnd() * 120; n.x = cx + Math.cos(ang) * rad; n.y = cy + Math.sin(ang) * rad; n.vx = n.vy = 0; n.fixed = false; });
  alpha = 1;
}

function drawStatic() {
  svg.innerHTML = "";
  const gl = el("g", {}), gn = el("g", {});
  for (const l of links) { l.line = el("line", { stroke: "rgba(255,255,255,.12)", "stroke-width": 1 }); gl.appendChild(l.line); }
  for (const n of nodes) {
    const g = el("g", { class: "gnode" });
    if (n.focus) { n.glow = el("circle", { r: n.r + 9, fill: "var(--accent)", opacity: ".16" }); g.appendChild(n.glow); }
    const bad = !n.focus && n.data.fails > 0;
    n.circle = el("circle", { r: n.r, fill: n.focus ? "var(--accent)" : (bad ? "rgba(229,72,77,.22)" : "rgba(63,178,127,.20)"), stroke: n.focus ? "var(--accent-2)" : (bad ? "var(--bad)" : "var(--good)"), "stroke-width": n.focus ? 2 : 1.5 });
    n.label = el("text", { class: "glabel" + (n.focus ? " f" : ""), "text-anchor": "middle" });
    n.label.textContent = n.focus ? n.name : short(n.name);
    g.appendChild(n.circle); g.appendChild(n.label);
    g.addEventListener("pointerdown", e => { drag = n; n.fixed = true; e.preventDefault(); });
    g.addEventListener("pointerenter", () => { hi(n); showTip(n); });
    g.addEventListener("pointerleave", () => { hi(null); hideTip(); });
    g.addEventListener("click", () => { if (!n.focus) selectNode(n.key); });
    gn.appendChild(g);
  }
  svg.appendChild(gl); svg.appendChild(gn); paint();
}

function paint() {
  for (const l of links) {
    let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    l.line.setAttribute("x1", (l.s.x + ux * l.s.r).toFixed(1)); l.line.setAttribute("y1", (l.s.y + uy * l.s.r).toFixed(1));
    l.line.setAttribute("x2", (l.t.x - ux * l.t.r).toFixed(1)); l.line.setAttribute("y2", (l.t.y - uy * l.t.r).toFixed(1));
  }
  for (const n of nodes) { const x = n.x.toFixed(1), y = n.y.toFixed(1); n.circle.setAttribute("cx", x); n.circle.setAttribute("cy", y); if (n.glow) { n.glow.setAttribute("cx", x); n.glow.setAttribute("cy", y); } n.label.setAttribute("x", x); n.label.setAttribute("y", (n.y + n.r + 12).toFixed(1)); }
}

function hi(n) {
  for (const l of links) l.line.setAttribute("stroke", !n ? "rgba(255,255,255,.12)" : (l.t === n || l.s === n ? "rgba(255,255,255,.5)" : "rgba(255,255,255,.05)"));
  for (const nd of nodes) nd.circle.setAttribute("opacity", !n || nd === n || nd.focus ? "1" : ".4");
}

function tick() {
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j]; let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const fr = 7000 / (d * d), ux = dx / d, uy = dy / d;
    if (!a.fixed) { a.vx -= ux * fr; a.vy -= uy * fr; } if (!b.fixed) { b.vx += ux * fr; b.vy += uy * fr; }
  }
  for (const l of links) { let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1; const fr = (d - l.rest) * 0.02, ux = dx / d, uy = dy / d; if (!l.t.fixed) { l.t.vx -= ux * fr; l.t.vy -= uy * fr; } }
  for (const n of nodes) { if (n.fixed) continue; n.vx *= 0.85; n.vy *= 0.85; n.x += n.vx * alpha; n.y += n.vy * alpha; n.x = Math.max(n.r + 8, Math.min(W - n.r - 8, n.x)); n.y = Math.max(n.r + 8, Math.min(H - n.r - 18, n.y)); }
  paint();
  alpha = Math.max(0.03, alpha * 0.99);
  raf = requestAnimationFrame(tick);
}

svg.addEventListener("pointermove", e => { if (!drag) return; const b = svg.getBoundingClientRect(); drag.x = (e.clientX - b.left) / b.width * W; drag.y = (e.clientY - b.top) / b.height * H; alpha = Math.max(alpha, 0.5); });
addEventListener("pointerup", () => { if (drag && !drag.focus) drag.fixed = false; drag = null; });

function showTip(n) {
  if (n.focus) { const a = n.data; tip.innerHTML = `<b>${esc(a.name)}</b> · ${a.score.toFixed(1)}<br>${links.length} counterparties · $${links.reduce((s, l) => s + l.t.data.vol, 0).toFixed(2)}`; }
  else { const c = n.data, rate = Math.round(c.success / c.receipts * 100); tip.innerHTML = `<b>${esc(c.name || short(c.id))}</b><br>${c.receipts} receipts · ${rate}% ok<br>$${c.vol.toFixed(3)} · standing ${(c.standing * 100).toFixed(0)}`; }
  tip.style.left = Math.max(6, Math.min(W - 170, n.x + 14)) + "px";
  tip.style.top = (n.y - n.r - 8) + "px";
  tip.style.opacity = "1";
}
function hideTip() { tip.style.opacity = "0"; }

function renderFocus() {
  const a = focus, tot = links.reduce((s, l) => s + l.t.data.vol, 0);
  document.getElementById("side").innerHTML = `<div class="gs-id">${avatarHtml()}<div style="flex:1;min-width:0">
      <div class="gs-head"><h3>${esc(a.name)}</h3><span class="sc" style="color:${grade(a.score)}">${a.score.toFixed(1)}</span></div>
      <div class="gs-sub">${esc(a.cat)}${a.id && a.id !== "—" ? " · #" + esc(a.id) : ""}</div>
    </div></div>
    <div class="kv"><span>Counterparties</span><b>${links.length}</b></div>
    <div class="kv"><span>Total volume</span><b>$${tot.toFixed(2)}</b></div>
    <div class="kv"><span>Healthy links</span><b>${links.filter(l => !l.bad).length} / ${links.length}</b></div>
    <div class="sect">How to read</div>
    <p class="hint2">Every node is a real agent from the directory. Click a counterparty for its stats, then <b>focus it</b> to walk the graph — or search any agent above.</p>`;
}

// overlay inside the stage: ranked counterparty list (interaction with the focus agent)
function renderCounterparties() {
  const tot = links.reduce((s, l) => s + l.t.data.vol, 0) || 1;
  const maxV = Math.max(0.001, ...links.map(l => l.t.data.vol));
  const rows = links.slice().sort((a, b) => b.t.data.vol - a.t.data.vol);
  document.getElementById("cpn").textContent = links.length;
  document.getElementById("cpbody").innerHTML = rows.map(l => {
    const c = l.t.data, pct = (c.vol / tot * 100).toFixed(0);
    return `<div class="cprow" data-key="${esc(l.t.key)}" title="$${c.vol.toFixed(3)} · standing ${(c.standing * 100).toFixed(0)}">
      <span class="cpr-ad"><span class="cpr-dot" style="background:${c.fails ? 'var(--bad)' : 'var(--good)'}"></span>${esc(c.name || short(c.id))}</span>
      <span class="cpr-bar"><i style="width:${(c.vol / maxV * 100).toFixed(0)}%"></i></span>
      <span class="cpr-m">${pct}% · ${c.receipts}r</span>
    </div>`;
  }).join("");
  document.querySelectorAll("#cpbody .cprow").forEach(r => r.addEventListener("click", () => selectNode(r.dataset.key)));
}

// right panel: full stats for the clicked counterparty
function renderCounterpartyDetail(c) {
  const rate = c.receipts ? Math.round(c.success / c.receipts * 100) : 0;
  const tot = links.reduce((s, l) => s + l.t.data.vol, 0) || 1;
  const pct = (c.vol / tot * 100).toFixed(0);
  const bad = c.fails > 0;
  const canFocus = !!c.agent;
  document.getElementById("side2").innerHTML =
    `<div class="gs-id">${avatarHtml()}<div style="flex:1;min-width:0">
       <div class="gs-head"><h3>${esc(c.name || short(c.id))}</h3><span class="sc" style="color:${bad ? 'var(--bad)' : 'var(--good)'}">${rate}%</span></div>
       <div class="gs-sub">counterparty of ${esc(focus.name)}</div>
     </div></div>
     <div class="kv"><span>Receipts</span><b>${c.receipts}</b></div>
     <div class="kv"><span>Successful</span><b style="color:var(--good)">${c.success}</b></div>
     <div class="kv"><span>Failed</span><b style="color:${bad ? 'var(--bad)' : 'var(--text)'}">${c.fails}</b></div>
     <div class="kv"><span>Volume</span><b>$${c.vol.toFixed(3)}</b></div>
     <div class="kv"><span>Share of volume</span><b>${pct}%</b></div>
     <div class="kv"><span>Standing</span><b>${(c.standing * 100).toFixed(0)}</b></div>
     <div class="kv"><span>Health</span><b style="color:${bad ? 'var(--bad)' : 'var(--good)'}">${bad ? 'has failures' : 'healthy'}</b></div>
     <div class="sect">Address</div>
     <p class="hint2" style="word-break:break-all">${esc(c.address || c.id)} <span class="addr-tag">ARC</span></p>
     ${canFocus ? `<button class="btn ghost" id="focusCp" style="--cham:7px;font-size:12px;margin-top:12px;width:100%;justify-content:center">Focus this agent →</button>` : ""}`;
  if (canFocus) document.getElementById("focusCp").addEventListener("click", () => setFocus(c.agent));
}

function selectNode(key) {
  const n = nodes.find(x => x.key === key); if (!n || n.focus) return;
  selected = key; hi(n);
  document.querySelectorAll("#cpbody .cprow").forEach(r => r.classList.toggle("sel", r.dataset.key === key));
  for (const nd of nodes) nd.circle.setAttribute("stroke-width", nd === n ? 3 : (nd.focus ? 2 : 1.5));
  renderCounterpartyDetail(n.data);
}

document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") { const a = byKey(e.target.value); if (a) setFocus(a); } });
document.getElementById("cph").addEventListener("click", () => document.getElementById("cpbox").classList.toggle("collapsed"));
document.getElementById("clearFocus").addEventListener("click", clearFocus);
function clearFocus() {
  focus = null; selected = null;
  if (raf) cancelAnimationFrame(raf); raf = null;
  nodes = []; links = [];
  svg.innerHTML = "";
  document.getElementById("focusPanel").classList.remove("has-focus");
  document.getElementById("cpn").textContent = "0";
  document.getElementById("cpbody").innerHTML = "";
  document.getElementById("side").innerHTML = '<div class="empty2">Search or pick an agent above to draw its counterparty graph.</div>';
  document.getElementById("side2").innerHTML = '<div class="empty2">Click a counterparty to see its details &amp; stats.</div>';
  document.getElementById("q").focus();
}
new ResizeObserver(() => { W = stage.clientWidth || W; H = stage.clientHeight || H; svg.setAttribute("viewBox", `0 0 ${W} ${H}`); if (nodes[0]) { nodes[0].x = W / 2; nodes[0].y = H / 2; alpha = Math.max(alpha, 0.4); } }).observe(stage);
(async function boot() {
  await loadPool();
  const start = [...POOL].sort((a, b) => b.score - a.score)[0];
  if (start) setFocus(start);
})();
</script>
</body>
